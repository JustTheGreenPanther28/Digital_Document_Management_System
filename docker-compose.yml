services:

  # ============================================================
  # DATABASE — PostgreSQL 16
  # Secrets injected from /etc/forsic/.env via env_file below
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: sih190-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih190_db}
      POSTGRES_USER: ${POSTGRES_USER:-sih190_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    expose:
      - "5432"
    networks:
      - sih190_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih190_user} -d ${POSTGRES_DB:-sih190_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # CACHE — Redis 7
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: sih190-redis
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --save 60 1 --loglevel warning --requirepass "${REDIS_PASSWORD}"
    expose:
      - "6379"
    networks:
      - sih190_internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # OBJECT STORAGE — MinIO (S3-compatible)
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-02-26T09-33-48Z
    container_name: sih190-minio
    restart: unless-stopped
    env_file:
      - .env
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    expose:
      - "9000"
      - "9001"
    networks:
      - sih190_internal
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # ANTI-MALWARE — ClamAV
  # ============================================================
  clamav:
    image: clamav/clamav:latest
    container_name: sih190-clamav
    restart: unless-stopped
    expose:
      - "3310"
    networks:
      - sih190_internal
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep -q PONG || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # SEARCH — Elasticsearch 8
  # ============================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: sih190-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    expose:
      - "9200"
    networks:
      - sih190_internal
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ============================================================
  # BACKEND — Spring Boot 3.4.3 / Java 21
  # All secrets injected from .env — none hardcoded here
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih190-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sih190_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sih190_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: ${S3_BUCKET_NAME:-sih190-evidence-vault}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sih190-api}
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
      PKI_KEYSTORE_PASSWORD: ${PKI_KEYSTORE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - sih190_internal
      - sih190_public

  # ============================================================
  # FRONTEND — React 18 + Nginx (with Let's Encrypt TLS)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih190-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    # No volume needed — self-signed TLS cert is generated inside the image at build time
    networks:
      - sih190_public

# ============================================================
# NETWORKS
# sih190_internal: internal-only (databases, cache, minio)
# sih190_public:   internet-facing (nginx, backend API)
# ============================================================
networks:
  sih190_internal:
    internal: true
  sih190_public:

# ============================================================
# PERSISTENT VOLUMES
# ============================================================
volumes:
  postgres_data:
  redis_data:
  minio_data:
  es_data:
