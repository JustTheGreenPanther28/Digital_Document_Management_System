services:
  postgres:
    image: postgres:16-alpine
    container_name: sih190-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih190_db}
      POSTGRES_USER: ${POSTGRES_USER:-sih190_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be configured}
    expose:
      - "5432"
    networks:
      - sih190_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih190_user} -d ${POSTGRES_DB:-sih190_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sih190-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass "${REDIS_PASSWORD:-}"
    expose:
      - "6379"
    networks:
      - sih190_internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-02-26T09-33-48Z
    container_name: sih190-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO password must be configured}
    expose:
      - "9000"
    networks:
      - sih190_internal
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: sih190-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    expose:
      - "9200"
    networks:
      - sih190_internal
    volumes:
      - es_data:/usr/share/elasticsearch/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih190-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sih190_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sih190_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: ${S3_BUCKET_NAME:-sih190-evidence-vault}
      CLOUDMERSIVE_API_KEY: ${CLOUDMERSIVE_API_KEY:-}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET}
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
    expose:
      - "8080"
    volumes:
      - backend_vault:/app/storage_vault
      - pki_data:/app/storage_vault/pki
    networks:
      - sih190_internal
      - sih190_public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih190-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
      - "443:443"
    networks:
      - sih190_public

networks:
  sih190_internal:
    internal: true
  sih190_public:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  es_data:
  backend_vault:
  pki_data:
