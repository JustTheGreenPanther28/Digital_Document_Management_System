spring:
  datasource:
    url: jdbc:h2:mem:sih190_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  jackson:
    serialization:
      fail-on-empty-beans: false

app:
  s3:
    local-fs-fallback: true
    local-storage-path: ./target/dev-storage-vault
  clamav:
    enabled: false
