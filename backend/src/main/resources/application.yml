server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sih190-case-management
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sih190_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # REQUIRED — no default. Set via OCI Vault → /etc/forsic/.env → docker-compose env_file
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
    issuer: sih190-security-auth
    audience: ${JWT_AUDIENCE:sih190-api}
  kms:
    # REQUIRED — no default. 32-byte AES-256 key, base64-encoded.
    master-key-base64: ${KMS_MASTER_KEY}
    algorithm: AES-256-GCM
    key-id: kms-key-vault-primary
  pki:
    keystore-path: ${PKI_KEYSTORE_PATH:./storage_vault/pki/sih190-pki.p12}
    # REQUIRED — no default.
    keystore-password: ${PKI_KEYSTORE_PASSWORD}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}
    bucket-name: ${S3_BUCKET_NAME:evidence-vault}
    quarantine-bucket-name: ${S3_QUARANTINE_BUCKET_NAME:quarantine-vault}
    path-style-access: true
    local-fs-fallback: ${S3_LOCAL_FS_FALLBACK:true}
    local-storage-path: ${LOCAL_STORAGE_PATH:./storage_vault}
  clamav:
    enabled: ${CLAMAV_ENABLED:true}
    fail-closed: ${CLAMAV_FAIL_CLOSED:true}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: 5000
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    enabled: ${ELASTICSEARCH_ENABLED:true}
  security:
    max-failed-attempts: 5
    lockout-duration-minutes: 15
    enforce-duplicate-rejection: ${ENFORCE_DUPLICATE_REJECTION:false}
    allowed-file-extensions:
      - pdf
      - jpg
      - jpeg
      - png
      - docx
      - mp4
      - zip
      - txt
      - pcap

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
spring:
  config:
    activate:
      on-profile: prod

app:
  s3:
    local-fs-fallback: false
  clamav:
    fail-closed: true
