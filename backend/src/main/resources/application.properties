server.port=${PORT:8080}
server.servlet.context-path=/

spring.application.name=sih190-case-management
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===================================================================
# 1. Database Configuration (Loads from .env / environment)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sih190_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway Database Migration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# ===================================================================
# 2. Redis Configuration (Loads from .env)
# ===================================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:default}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}

# ===================================================================
# 3. Object Storage - Supabase S3 / MinIO (Loads from .env)
# ===================================================================
app.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.s3.access-key=${S3_ACCESS_KEY:}
app.s3.secret-key=${S3_SECRET_KEY:}
app.s3.region=${S3_REGION:us-east-1}
app.s3.bucket-name=${S3_BUCKET_NAME:evidence-vault}
app.s3.quarantine-bucket-name=${S3_QUARANTINE_BUCKET_NAME:quarantine-vault}
app.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
app.s3.local-fs-fallback=${S3_LOCAL_FS_FALLBACK:true}
app.s3.local-storage-path=${LOCAL_STORAGE_PATH:./storage_vault}

# ===================================================================
# 4. Elasticsearch (Optional)
# ===================================================================
app.elasticsearch.url=${ELASTICSEARCH_URL:}
app.elasticsearch.enabled=${ELASTICSEARCH_ENABLED:false}
app.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
app.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}

# ===================================================================
# 5. VirusTotal API (Optional)
# ===================================================================
app.virustotal.api-key=${VIRUSTOTAL_API_KEY:}
app.virustotal.endpoint=${VIRUSTOTAL_ENDPOINT:https://www.virustotal.com/api/v3/files}
app.virustotal.enabled=${VIRUSTOTAL_ENABLED:false}
app.virustotal.fail-closed=${VIRUSTOTAL_FAIL_CLOSED:false}
app.virustotal.timeout-ms=15000
app.virustotal.poll-interval-ms=3000
app.virustotal.max-poll-attempts=10

# ===================================================================
# 6. Cryptography, PKI, KMS & Token Security (Loads from .env)
# ===================================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:90000000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:60480000000}
app.jwt.issuer=${JWT_ISSUER:sih190-random-most}
app.jwt.audience=${JWT_AUDIENCE:sih190-random}

app.kms.master-key-base64=${KMS_MASTER_KEY:}
app.kms.algorithm=AES-256-GCM
app.kms.key-id=${KMS_KEY_ID:kms-key-vault-primary}

app.pki.keystore-path=${PKI_KEYSTORE_PATH:./storage_vault/pki/sih190-pki.p12}
app.pki.keystore-password=${PKI_KEYSTORE_PASSWORD:}

# Security Policies
app.security.max-failed-attempts=5
app.security.lockout-duration-minutes=15
app.security.enforce-duplicate-rejection=${ENFORCE_DUPLICATE_REJECTION:false}
app.security.allowed-file-extensions=pdf,jpg,jpeg,png,docx,mp4,zip,txt,pcap

# ===================================================================
# 7. Email Service (SMTP - Loads from .env)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
app.mail.from=${APP_MAIL_FROM:noreply@ndcms.gov.in}
app.mail.otp-expiration-seconds=${APP_MAIL_OTP_EXPIRATION_SECONDS:300}

# ===================================================================
# 8. Central Administrator Seed Account (Loads from .env)
# ===================================================================
app.admin.username=${ADMIN_USERNAME:ADMIN}
app.admin.email=${ADMIN_EMAIL:admin@ndcms.gov.in}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:Admin@2026}
app.admin.badge-number=${ADMIN_BADGE_NUMBER:ADMIN-001}
app.admin.full-name=${ADMIN_FULL_NAME:Chief System Administrator}
app.admin.department=${ADMIN_DEPARTMENT:National Cyber Defense HQ}

app.seed-demo-data=true

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics