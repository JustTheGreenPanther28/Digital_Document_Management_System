server.port=${PORT:8080}
server.servlet.context-path=/

spring.application.name=sih190-case-management
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===================================================================
# 1. Supabase PostgreSQL Database Configuration
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate (PostgreSQL Dialect)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# 2. Upstash Redis Configuration (Distributed Caching & Rate Limiting)
# ===================================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:default}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:true}

# ===================================================================
# 3. Backblaze B2 S3 / MinIO Private Evidence Vault
# ===================================================================
app.s3.endpoint=${S3_ENDPOINT}
app.s3.access-key=${S3_ACCESS_KEY}
app.s3.secret-key=${S3_SECRET_KEY}
app.s3.region=${S3_REGION:us-east-005}
app.s3.bucket-name=${S3_BUCKET_NAME}
app.s3.quarantine-bucket-name=${S3_QUARANTINE_BUCKET_NAME}
app.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
app.s3.local-fs-fallback=${S3_LOCAL_FS_FALLBACK:false}
app.s3.local-storage-path=${LOCAL_STORAGE_PATH:./storage_vault}

# ===================================================================
# 4. Bonsai Elasticsearch (Full-Text Forensic Search)
# ===================================================================
app.elasticsearch.url=${ELASTICSEARCH_URL}
app.elasticsearch.enabled=${ELASTICSEARCH_ENABLED:true}
app.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
app.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}

# ===================================================================
# 5. Cloudmersive Virus & Malware Scanning API
# ===================================================================
app.cloudmersive.api-key=${CLOUDMERSIVE_API_KEY}
app.cloudmersive.endpoint=${CLOUDMERSIVE_ENDPOINT:https://api.cloudmersive.com/virus/scan/file}
app.cloudmersive.enabled=${CLOUDMERSIVE_ENABLED:true}
app.cloudmersive.fail-closed=${CLOUDMERSIVE_FAIL_CLOSED:false}
app.cloudmersive.timeout-ms=${CLOUDMERSIVE_TIMEOUT_MS:15000}

# ===================================================================
# 6. Cryptography, PKI, KMS & Token Security
# ===================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
app.jwt.issuer=sih190-security-auth
app.jwt.audience=${JWT_AUDIENCE:sih190-api}

app.kms.master-key-base64=${KMS_MASTER_KEY}
app.kms.algorithm=AES-256-GCM
app.kms.key-id=${KMS_KEY_ID:kms-key-vault-primary}

app.pki.keystore-path=${PKI_KEYSTORE_PATH:./storage_vault/pki/sih190-pki.p12}
app.pki.keystore-password=${PKI_KEYSTORE_PASSWORD}

# Security Policies
app.security.max-failed-attempts=5
app.security.lockout-duration-minutes=15
app.security.enforce-duplicate-rejection=${ENFORCE_DUPLICATE_REJECTION:false}
app.security.allowed-file-extensions=pdf,jpg,jpeg,png,docx,mp4,zip,txt,pcap

# ===================================================================
# 7. Enterprise Email Service & SMTP (Email OTP Delivery)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
app.mail.from=${APP_MAIL_FROM:noreply@ndcms.gov.in}
app.mail.otp-expiration-seconds=${APP_MAIL_OTP_EXPIRATION_SECONDS:300}

# ===================================================================
# 9. Dynamic Central Administrator Initialization
# ===================================================================
app.admin.username=${ADMIN_USERNAME:ADMIN}
app.admin.email=${ADMIN_EMAIL:admin@ndcms.gov.in}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:Admin@2026!Secure}
app.admin.badge-number=${ADMIN_BADGE_NUMBER:ADMIN-001}
app.admin.full-name=${ADMIN_FULL_NAME:Chief System Administrator}
app.admin.department=${ADMIN_DEPARTMENT:National Cyber Defense HQ}

app.totp.secret = ${TOTP_SECRET}

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
