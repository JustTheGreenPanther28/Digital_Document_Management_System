# ==============================================================================
# Production Nginx config — FORSIC Case Management
# No domain — using VM public IP with self-signed TLS certificate
# Certs generated inside the container at build time (see frontend/Dockerfile)
# ==============================================================================

# HTTP → HTTPS redirect (catch-all for any IP/hostname)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Healthcheck (useful for OCI load-balancer probes)
    location /healthz {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Redirect all HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main application server (self-signed cert, generated in Dockerfile)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # ---- Self-signed TLS (generated at container build time) ----
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # TLS Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security Headers ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Client body limit for evidence uploads
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Healthcheck endpoint ----
    location /healthz {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ---- Reverse proxy → Spring Boot backend ----
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ---- SPA routing fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Static asset caching ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
